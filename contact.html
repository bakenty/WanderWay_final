</nav><main class="container"><section class="page-title py-5 mt-4 mb-5 text-center"><h1>Contact Us</h1><p class="mb-0">Have a destination in mind? Send us a message.</p></section><section class="row justify-content-center pb-5"><div class="col-12 col-lg-8"><div class="card shadow-sm"><img class="card-img-top contact-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" data-src="images/concat.jpeg" loading="lazy" alt="Travel communication illustration"><div class="card-body p-4 p-md-5"><form id="contactForm" action="#" method="post" novalidate>
                    <div class="mb-3 field-group"><label for="name" class="form-label">Name</label><input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" autocomplete="name" data-rules="required name" data-label="name"></div>
                    <div class="mb-3 field-group"><label for="email" class="form-label">Email</label><input type="text" inputmode="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" data-rules="required email" data-label="email address"></div>
                    <div class="mb-3 field-group"><label for="phone" class="form-label">Phone</label><input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 701 234 56 78" autocomplete="tel" data-rules="required phone" data-label="phone number"></div>
                    <div class="mb-3"><label for="destination" class="form-label">Favorite destination</label><select class="form-select" id="destination" name="destination"><option value="japan">Japan</option><option value="italy">Italy</option><option value="kazakhstan">Kazakhstan</option><option value="egypt">Egypt</option><option value="greece">Greece</option><option value="switzerland">Switzerland</option><option value="other">Other</option></select></div>
                    <fieldset class="mb-3"><legend class="fs-6">Choose your travel mood:</legend><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mood" id="adventure" value="adventure" checked><label class="form-check-label" for="adventure">Adventure</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mood" id="relaxation" value="relaxation"><label class="form-check-label" for="relaxation">Relaxation</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mood" id="culture" value="culture"><label class="form-check-label" for="culture">Culture</label></div></fieldset>
                    <div class="mb-4 field-group"><label for="message" class="form-label">Message</label><textarea class="form-control" id="message" name="message" rows="6" placeholder="Write your message (at least 10 characters)" data-rules="required minlength" data-min="10" data-label="message"></textarea></div>
                    <p class="form-status" role="status" aria-live="polite"></p>
                    <div class="d-grid d-sm-flex gap-2"><button type="submit" class="btn btn-primary btn-lg">Send Message</button><button type="reset" class="btn btn-outline-secondary btn-sm align-self-sm-center">Clear</button></div>
                </form></div></div></div></section></main><footer class="site-footer mt-5 py-4 text-center">
